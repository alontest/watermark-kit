[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watermark-kit"
version = "0.1.0"
description = "可逆图像水印：加水印后可按记录参数近乎无损还原"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
watermark = "watermark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["watermark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
